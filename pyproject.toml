[project]
name = "skill-eval-platform"
version = "0.1.0"
description = "Skill productivity evaluation platform: measures how much SKILL.md-based skills improve agent success rate, time, and cost (Skill Lift / Operational Lift / Coverage)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skill-eval = "skill_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skill_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
